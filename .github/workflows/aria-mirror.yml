name: Mirror Aria anonymized research snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    paths:
      - '.github/workflows/aria-mirror.yml'
      - 'mirror/**'

permissions:
  contents: write

concurrency:
  group: aria-mirror-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Dagger Python SDK
        run: python -m pip install --disable-pip-version-check 'dagger-io==0.21.10'
      - name: Dagger unit tests
        run: python mirror/pipeline.py test

  mirror:
    if: github.event_name != 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Dagger Python SDK
        run: python -m pip install --disable-pip-version-check 'dagger-io==0.21.10'
      - name: Fetch and validate source in isolated Dagger container
        run: python mirror/pipeline.py fetch --export .mirror-stage
      - name: Apply validated snapshot
        run: python mirror/apply.py --stage .mirror-stage --destination upstream
      - name: Commit and push only if source contents changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- upstream/
          if git diff --cached --quiet; then
            echo 'Source snapshot unchanged; nothing to push.'
            exit 0
          fi
          git commit -m 'mirror: synchronize anonymized Aria source snapshot'
          git push origin HEAD:${{ github.event.repository.default_branch }}
